/* Postal de viaje: tinta cobalto sobre crema, rayas celestes, un toque de limón.

:root{

  --navy:#1B2550;       /* texto y etiquetas */
  --celeste:#BFDDF0;    /* rayas */
  --celeste-2:#E4F0F8;  /* superficies destacadas */
  --lemon:#F3D55B;      /* acento, un toque por pantalla */

  --line:#DCD6C6;
  --ok:#2F7D62;
  --due:#B5452F;

  --r-btn:14px;

  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stripes);color:var(--navy);font:400 16px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lemon);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Ilustraciones (máscara, se pintan con un color de la paleta) ---------- */
.ilu{display:inline-block;flex:none;background:var(--ilu,var(--cobalt));-webkit-mask:var(--src) center/contain no-repeat;mask:var(--src) center/contain no-repeat}
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Estructura ---------- */
.app{max-width:440px;min-height:100%;margin:0 auto;overflow-x:clip;background:var(--cream);position:relative;box-shadow:0 0 0 1px rgba(27,37,80,.06)}
.screen{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.screen[hidden]{display:none}

/* ---------- Tipografía ---------- */
.eyebrow{font:600 12px/1.2 var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h-display{font:500 34px/1.02 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.h-screen{font:700 24px/1.1 var(--f-display);margin:0}
.h-card{font:700 17px/1.25 var(--f-ui);margin:0}
.script{font:700 30px/1 var(--f-script);color:var(--cobalt)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:14px}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-btn);border:1.5px solid transparent;font-weight:700;font-size:16px;text-decoration:none;transition:transform .12s ease,background .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--cobalt);color:var(--paper)}
.btn-primary:disabled{background:#9AA6CF;cursor:not-allowed}
.btn-secondary{background:var(--paper);color:var(--cobalt);border-color:var(--cobalt)}
.btn-ghost{background:transparent;color:var(--cobalt);min-height:40px;padding:0 10px}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;border:0;background:var(--paper);color:var(--navy);box-shadow:var(--shadow)}

/* ---------- Tarjetas ---------- */
.card{background:var(--paper);border-radius:var(--r-card);padding:16px;box-shadow:var(--shadow);position:relative}
.card-feature{background:var(--celeste-2);border:1.5px solid var(--cobalt);box-shadow:none}
.card-tap{display:block;width:100%;text-align:left;border:0;color:inherit}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row > .grow{flex:1;min-width:0}
.list{display:flex;flex-direction:column;background:var(--paper);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.list-item{display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;background:none;width:100%;text-align:left;color:inherit;min-height:60px}
.list-item + .list-item{border-top:1px solid var(--line)}
.list-item .chev{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;background:var(--celeste-2);color:var(--navy);font:600 13px/1 var(--f-ui);white-space:nowrap}
.chip-lemon{background:var(--lemon)}
.chip-navy{background:var(--navy);color:var(--paper)}
.tag{display:inline-block;padding:4px 10px;border-radius:6px;background:var(--navy);color:var(--paper);font:700 11px/1.2 var(--f-ui);letter-spacing:.08em;text-transform:uppercase}

/* ---------- Avatares ---------- */
.avatar{--s:40px;width:var(--s);height:var(--s);border-radius:50%;overflow:hidden;flex:none;display:inline-grid;place-items:center;background:var(--celeste);color:var(--navy);font:700 calc(var(--s)*.38)/1 var(--f-ui);box-shadow:0 0 0 2px var(--paper)}
.avatar svg{width:100%;height:100%;display:block}
.avatar-stack{display:flex}
.avatar-stack .avatar + .avatar{margin-left:-10px}

/* ---------- Formularios ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .label{font:600 14px/1.2 var(--f-ui)}
.input,.select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:10px 14px;font-size:16px}
.input:focus,.select:focus{border-color:var(--cobalt);outline:none;box-shadow:0 0 0 3px rgba(45,72,166,.15)}
.input-money{font:600 26px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}
.error{font-size:13px;color:var(--due);font-weight:600}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--celeste-2);padding:4px;border-radius:12px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:700;color:var(--navy)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--cobalt);box-shadow:var(--shadow)}

/* ---------- Estado de desbloqueo ---------- */
.lock{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r-card);border:1.5px dashed var(--cobalt);background:repeating-linear-gradient(135deg,transparent 0 10px,rgba(191,221,240,.35) 10px 20px),var(--paper)}
.lock .lock-ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--celeste-2);color:var(--cobalt);flex:none}
.lock.is-open{border-style:solid;background:var(--paper)}
.lock.is-open .lock-ico{background:var(--lemon);color:var(--navy)}

/* ---------- Navegación inferior ---------- */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,440px);z-index:40;background:var(--paper);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
.tabbar[hidden]{display:none}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;border-radius:12px;color:var(--muted);text-decoration:none;font:600 12px/1 var(--f-ui)}
.tabbar a[aria-current="page"]{color:var(--cobalt);background:var(--celeste-2)}
body.typing .tabbar{display:none}

/* ---------- Encabezado compacto ---------- */
.topbar{display:flex;align-items:center;gap:12px;min-height:52px;padding-top:4px}
.topbar .grow{flex:1;min-width:0}
.topbar .date{font:700 22px/1.1 var(--f-display)}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--cobalt);font-weight:700;min-height:44px;padding:0 4px 0 0}

/* ---------- Portada ---------- */
.cover{min-height:100vh;min-height:100svh;background:var(--stripes);display:flex;flex-direction:column;align-items:center;gap:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px;text-align:center}
.cover[hidden]{display:none}
.postal-wrap{width:100%;max-width:360px;filter:drop-shadow(0 6px 10px rgba(27,37,80,.18))}
.postal{background:var(--paper);padding:7px;
  -webkit-mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle 4.5px at 7px 7px,transparent 96%,#000) -7px -7px/14px 14px;
  mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle 4.5px at 7px 7px,transparent 96%,#000) -7px -7px/14px 14px}
.postal-in{margin:8px;border:1.5px solid var(--cobalt);padding:14px 10px 12px;display:flex;flex-direction:column;gap:6px;align-items:center}
.cover h1{font:500 clamp(34px,10vw,44px)/1 var(--f-display);margin:0;color:var(--navy)}
.cover h1 em{font-style:italic}
.cover .script{font-size:clamp(30px,9vw,38px)}
.art{position:relative;width:100%;max-width:340px;aspect-ratio:300/300}
.art .bride{position:absolute;inset:4% 8% 0 8%;width:84%;height:auto}
.art .ilu{position:absolute}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:360px}
.cd{background:var(--paper);border-radius:14px;padding:10px 4px 8px;box-shadow:var(--shadow);border:1.5px solid var(--cobalt)}
.cd b{display:block;font:500 30px/1 var(--f-display);color:var(--cobalt);font-variant-numeric:tabular-nums}
.cd span{font:700 11px/1 var(--f-ui);letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;color:var(--navy)}
.cover-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.cover .pill-label{background:var(--navy);color:var(--paper);padding:6px 12px;border-radius:99px;font:700 12px/1 var(--f-ui);letter-spacing:.1em;text-transform:uppercase}
.preview-toggle{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--paper);border-radius:99px;padding:6px 8px 6px 14px;font-size:13px;font-weight:600;border:0;box-shadow:var(--shadow);align-self:center}
.switch{width:40px;height:24px;border-radius:99px;background:#C9CFE3;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
[aria-checked="true"] .switch{background:var(--cobalt)}
[aria-checked="true"] .switch::after{transform:translateX(16px)}

/* ---------- Hoy ---------- */
.next{background:var(--celeste-2);border:1.5px solid var(--cobalt);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative}
.next .time{font:500 52px/1 var(--f-display);color:var(--cobalt);font-variant-numeric:tabular-nums}
.next .what{font:700 22px/1.15 var(--f-ui);margin:0}
.next .where{display:flex;gap:6px;align-items:center;color:var(--navy);font-weight:500}
.next .deco{position:absolute;right:-6px;top:10px;width:96px;opacity:.9}
.mini{display:flex;flex-direction:column;gap:10px}
.mini .ilu{width:34px;position:absolute;right:12px;top:12px}
.timeline{display:flex;flex-direction:column}
.tl{display:grid;grid-template-columns:56px 20px 1fr;column-gap:10px;min-height:58px}
.tl .t{font:600 15px/1.3 var(--f-ui);font-variant-numeric:tabular-nums;padding-top:1px;text-align:right}
.tl .rail{position:relative;display:flex;justify-content:center}
.tl .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.tl:first-child .rail::before{top:8px}
.tl:last-child .rail::before{bottom:calc(100% - 8px)}
.tl .dot{position:relative;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--muted);margin-top:3px}
.tl .body{padding-bottom:14px;min-width:0}
.tl .body b{display:block;font-weight:700}
.tl .body span{font-size:14px;color:var(--muted)}
.tl.done .t,.tl.done .body b{color:var(--muted)}
.tl.done .dot{background:var(--muted);border-color:var(--muted)}
.tl.next-item .dot{background:var(--lemon);border-color:var(--cobalt);width:16px;height:16px}
.tl.next-item .body b{color:var(--cobalt)}

/* ---------- Panel inferior (sheet) ---------- */
.scrim{position:fixed;inset:0;background:rgba(27,37,80,.42);z-index:60;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:50%;transform:translate(-50%,100%);bottom:var(--kb,0px);width:min(100%,440px);max-height:calc(var(--vvh,100vh) - 24px);z-index:61;background:var(--cream);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:translate(-50%,0)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));flex:none}
.sheet-head::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet-head h2{flex:1;margin:8px 0 0;font:700 22px/1.1 var(--f-display)}
.sheet-body{overflow:auto;overscroll-behavior:contain;padding:8px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}
.sheet-foot{flex:none;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-top:1px solid var(--line);display:flex;gap:10px}
body.kb-open .sheet-foot{padding-bottom:12px}
.sheet-foot.stack{flex-direction:column;gap:8px}
.foot-sum{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.viewer-actions .btn{font-size:15px;padding:0 12px}

a.card-tap,a.list{text-decoration:none;color:inherit}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.screen-head{display:flex;align-items:center;gap:12px;min-height:52px;padding-top:4px}
.screen-head .grow{flex:1;min-width:0}

/* ---------- Galería ---------- */
.days{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.days::-webkit-scrollbar{display:none}
.day-chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px;padding:8px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);font-weight:700}
.day-chip small{font:600 11px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:3px;align-items:center}
.day-chip[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt);color:var(--paper)}
.day-chip[aria-pressed="true"] small{color:var(--celeste)}
.day-chip .ico{width:12px;height:12px}
.upload{display:flex;flex-direction:column;gap:6px}
.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumb{min-width:0;position:relative;border:0;padding:6px 6px 8px;background:var(--paper);border-radius:6px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px}
.thumb:nth-child(4n+1){transform:rotate(-.8deg)} .thumb:nth-child(4n+2){transform:rotate(.7deg)} .thumb:nth-child(4n+3){transform:rotate(.5deg)} .thumb:nth-child(4n){transform:rotate(-.6deg)}
.thumb .ph{aspect-ratio:4/5;width:100%;border-radius:2px;overflow:hidden;background:var(--celeste-2);position:relative}
.thumb .ph img,.thumb .ph video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .play{position:absolute;inset:0;margin:auto;width:46px;height:46px;border-radius:50%;background:rgba(255,253,247,.92);color:var(--cobalt);display:grid;place-items:center}
.thumb .dur{position:absolute;right:6px;bottom:6px;background:rgba(27,37,80,.8);color:#fff;font:600 12px/1 var(--f-ui);padding:4px 6px;border-radius:6px}
.thumb .badge{position:absolute;left:6px;top:6px;background:var(--lemon);color:var(--navy);border-radius:99px;padding:3px 7px;font:700 11px/1 var(--f-ui);display:flex;gap:3px;align-items:center}
.thumb .badge .ico{width:12px;height:12px}
.thumb figcaption{font:600 18px/1 var(--f-script);color:var(--navy);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 16px}
.empty .ilu{width:84px}

.viewer{position:fixed;inset:0;z-index:70;background:#121A3A;color:var(--paper);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:440px;margin:0 auto}
.viewer[hidden]{display:none}
.viewer-top{display:flex;align-items:center;gap:12px}
.viewer-top .grow{flex:1;min-width:0}
.viewer-media{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;padding:12px 0}
.viewer-media img,.viewer-media video{max-width:100%;max-height:100%;border-radius:6px;object-fit:contain;background:#000}
.viewer-media .play{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(255,253,247,.92);color:var(--cobalt);display:grid;place-items:center}
.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,253,247,.18);color:#fff;display:grid;place-items:center}
.viewer-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.viewer .btn-secondary{background:transparent;color:var(--paper);border-color:rgba(255,253,247,.6)}
.viewer .btn-primary{background:var(--lemon);color:var(--navy)}
.viewer .icon-btn{background:rgba(255,253,247,.14);color:#fff;box-shadow:none}

/* ---------- Gastos ---------- */
.bal{display:flex;flex-direction:column;gap:6px}
.bal .amt{font:700 22px/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.bal.owe .amt{color:var(--due)}
.bal.owed .amt{color:var(--ok)}
.bal .none{font-weight:600;color:var(--muted)}
.xfer{display:flex;align-items:center;gap:12px;padding:14px 16px}
.xfer + .xfer{border-top:1px solid var(--line)}
.xfer .grow{flex:1;min-width:0}
.xfer b{font-weight:700}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.exp{display:flex;align-items:center;gap:12px;padding:12px 16px}
.exp + .exp{border-top:1px solid var(--line)}
.exp .grow{flex:1;min-width:0}
details.more summary{list-style:none;cursor:pointer;color:var(--cobalt);font-weight:700;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary .ico{transform:rotate(90deg)}
.who-grid{display:flex;flex-wrap:wrap;gap:8px}
.who{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;min-height:40px}
.who[aria-pressed="true"]{border-color:var(--cobalt);background:var(--celeste-2)}
.who[aria-pressed="false"] .avatar{filter:grayscale(1);opacity:.5}
.preview{background:var(--paper);border:1.5px dashed var(--cobalt);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.preview .split-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.preview .me-line{background:var(--celeste-2);border-radius:10px;padding:10px 12px;font-weight:700}
.conv-result{font:500 40px/1.1 var(--f-display);color:var(--cobalt);font-variant-numeric:tabular-nums;word-break:break-word}

/* ---------- Casa ---------- */
.turn{display:flex;align-items:center;gap:12px;padding:12px 0}
.turn + .turn{border-top:1px solid var(--line)}
.turn .role{width:68px;flex:none}
.turn .people{display:flex;flex-wrap:wrap;gap:10px 14px;flex:1;min-width:0}
.turn .p{display:flex;align-items:center;gap:8px;min-width:0}
.turn .p small{display:block;color:var(--muted);font-size:12px}
.vote-card{background:var(--lemon);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.vote-card .ilu{position:absolute;right:-8px;top:-10px;width:92px;--ilu:var(--navy);opacity:.85}
.vote-card h2{font:700 24px/1.1 var(--f-display);margin:0;max-width:75%}
.vote-card > .small{max-width:72%}
.bar{height:8px;border-radius:4px;background:rgba(27,37,80,.12);overflow:hidden}
.bar i{display:block;height:100%;background:var(--cobalt);border-radius:4px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);width:100%;text-align:left}
.opt[aria-checked="true"]{border-color:var(--cobalt);background:var(--celeste-2)}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--cobalt)}
.opt[aria-checked="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--cobalt)}
.check{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;background:none;width:100%;text-align:left;font-size:16px}
.check + .check{border-top:1px solid var(--line)}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--cobalt);display:grid;place-items:center;flex:none;color:var(--paper)}
.check[aria-checked="true"] .box{background:var(--cobalt)}
.check[aria-checked="true"] span.txt{text-decoration:line-through;color:var(--muted)}
.week{width:100%;border-collapse:collapse;font-size:14px}
.week th,.week td{padding:10px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.week th{font:700 12px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.week tr.today td{background:var(--celeste-2)}
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;padding:4px;color:var(--cobalt)}
.stars .ico{width:32px;height:32px}
.stars button[aria-pressed="true"] .ico{fill:var(--lemon)}

/* ---------- Más ---------- */
.more-ilu{width:44px;height:44px;display:grid;place-items:center;background:var(--celeste-2);border-radius:12px;flex:none}
.more-ilu .ilu{width:32px;max-height:34px}
.girlies{margin:-12px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:16px max(16px,env(safe-area-inset-left,0px)) 28px;background:var(--stripes);display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 80px)}
.girlies .title{background:var(--paper);border:1.5px solid var(--cobalt);padding:14px;text-align:center;border-radius:4px}
.girlies .title h1{font:500 40px/1 var(--f-display);margin:0}
.girlies .title h1 em{font-style:italic}
.wife{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--paper);border-radius:24px;padding:22px 16px 18px;position:relative;box-shadow:var(--shadow)}
.wife .avatar{box-shadow:0 0 0 4px var(--paper),0 0 0 6px var(--cobalt)}
.wife .bow{position:absolute;top:-16px;width:70px;transform:rotate(-6deg)}
.wife .tag{background:var(--cobalt);font-size:12px;padding:6px 12px}
.wife .name{font:500 30px/1 var(--f-display)}
.crew{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 10px}

  const back = {

function avatar(id, size=40, extra=""){
  const p = person(id);
  const inner = p.photoUrl ? `<img src="${esc(p.photoUrl)}" alt="" loading="lazy">` : p.look ? portrait(p) : esc(p.name.slice(0,1).toUpperCase());
  return `<span class="avatar ${extra}" style="--s:${size}px" title="${esc(p.name)}">${inner}</span>`;
}
const avatars = (ids, size=32) => `<span class="avatar-stack">${ids.map(i => avatar(i, size)).join("")}</span>`;
const names = ids => {
  const n = ids.map(id => esc(who(id)));
  return n.length < 2 ? (n[0] || "—") : n.slice(0,-1).join(", ") + " y " + n[n.length-1];
};

/* ================= Perfiles =================
   Cada una pone su nombre, apodo, foto y una descripción. Se guarda en profiles/<persona>;
   sin base compartida queda en este teléfono. */
PEOPLE.forEach(p => { p._base = {name:p.name, nick:p.nick}; p.bio = ""; p.photoUrl = ""; });
const ASSET_ID = /^[A-Za-z0-9_-]{8,64}$/;
S.profiles = store.get("profiles", {});
function applyProfiles(){
  PEOPLE.forEach(p => {
    const pr = S.profiles[p.id] || {};
    const txt = (v, n) => typeof v === "string" && v.trim() ? v.trim().slice(0, n) : "";
    p.name = txt(pr.name, 24) || p._base.name;
    p.nick = p.bride ? p._base.nick : (txt(pr.nick, 28) || p._base.nick);
    p.bio = txt(pr.bio, 160);
    p.photoUrl = typeof pr.photoData === "string" && /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(pr.photoData) ? pr.photoData
      : (typeof pr.photo === "string" && ASSET_ID.test(pr.photo) ? "/_blob/" + pr.photo : "");
    p.uid = typeof pr.uid === "string" ? pr.uid : null;
  });
}
applyProfiles();
/* Recorta al centro en cuadrado y la achica a 480 px en JPEG */
async function squareJpeg(file, size = 480){
  let src = null;
  try{ src = await createImageBitmap(file); }catch(e){}
  if (!src) src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  const w = src.width, h = src.height, s = Math.min(w, h);
  const c = document.createElement("canvas"); c.width = c.height = size;
  c.getContext("2d").drawImage(src, (w - s)/2, (h - s)/2, s, s, 0, 0, size, size);
  return await new Promise(r => c.toBlob(r, "image/jpeg", .86));
}
const blobToDataURL = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); });
let PF = null, PICK_CONFIRM = null;
function profileSheet(first = false){
  const p = person(ME), canPhoto = !SH.on || !!SH.assets;
  PF = {blob:null, removed:false, busy:false};
  openSheet(first ? "Completá tu perfil" : "Tu perfil", `
    ${first ? `<p class="small muted" style="margin:0">Así te ven las demás en la app. Lo podés cambiar cuando quieras desde Más.</p>` : ""}
    <div class="pf-photo">
      <span class="avatar" id="pf-av" style="--s:104px">${p.photoUrl ? `<img src="${esc(p.photoUrl)}" alt="">` : p.look ? portrait(p) : esc(p.name.slice(0,1).toUpperCase())}</span>
      <div class="pf-photo-actions">
        <button type="button" class="btn btn-secondary btn-sm" data-act="pf-pick" ${canPhoto ? "" : "disabled"}>${icon("upload")} ${p.photoUrl ? "Cambiar foto" : "Subir foto"}</button>
        ${p.photoUrl ? `<button type="button" class="btn btn-ghost btn-sm" data-act="pf-remove">Quitar foto</button>` : ""}
        ${canPhoto ? `<span class="hint">Se recorta en cuadrado.</span>` : `<span class="hint">Para subir la foto necesitás ser editora. Pedíselo a Feda.</span>`}
      </div>
    </div>
    <div class="field"><label for="pf-name">Tu nombre</label><input class="input" id="pf-name" maxlength="24" autocomplete="given-name" value="${esc(p.name)}"></div>
    ${p.bride ? "" : `<div class="field"><label for="pf-nick">Tu apodo</label><input class="input" id="pf-nick" maxlength="28" autocomplete="off" value="${esc(p.nick)}"><span class="hint">Es la etiqueta azul que va debajo de tu foto.</span></div>`}
    <div class="field"><label for="pf-bio">Sobre vos</label><textarea class="input" id="pf-bio" maxlength="160" rows="3" placeholder="Ej.: la que siempre lleva protector y nunca se lo pone">${esc(p.bio)}</textarea><span class="hint" id="pf-count">${p.bio.length}/160</span></div>
    <div id="pf-err" role="alert"></div>
    <input type="file" id="pf-file" accept="image/*" hidden>`,
    `<button class="btn btn-primary btn-block" id="pf-save" data-act="pf-save">Guardar perfil</button>`);
  const body = document.getElementById("sheet-body");
  const onInput = e => { if (e.target.id === "pf-bio") document.getElementById("pf-count").textContent = e.target.value.length + "/160"; };
  body.addEventListener("input", onInput);
  document.getElementById("pf-file").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    try{
      PF.blob = await squareJpeg(f); PF.removed = false;
      document.getElementById("pf-av").innerHTML = `<img src="${URL.createObjectURL(PF.blob)}" alt="">`;
    }catch(err){ toast("No se pudo leer esa foto. Probá con otra."); }
  });
  sheetCleanup = () => { body.removeEventListener("input", onInput); PF = null; };
}
async function saveProfile(){
  if (!PF || PF.busy) return;
  const name = document.getElementById("pf-name").value.trim().slice(0, 24);
  const nickEl = document.getElementById("pf-nick");
  const nick = nickEl ? nickEl.value.trim().slice(0, 28) : "";
  const bio = document.getElementById("pf-bio").value.trim().slice(0, 160);
  const err = document.getElementById("pf-err");
  if (!name){ err.innerHTML = `<span class="error">Escribí tu nombre.</span>`; document.getElementById("pf-name").focus(); return; }
  err.innerHTML = "";
  PF.busy = true; const btn = document.getElementById("pf-save"); btn.disabled = true; btn.textContent = "Guardando…";
  const prev = S.profiles[ME] || {};
  const doc = {name, nick, bio, uid: SH.uid || null, at: Date.now()};
  try{
    if (SH.on){
      doc.photo = PF.removed ? "" : (prev.photo || "");
      if (PF.blob){ toast("Subiendo la foto…"); const res = await SH.assets.upload(PF.blob, {type:"image/jpeg"}); doc.photo = res.id; }
      if (!(await write(db => db.doc("profiles/" + ME).set(doc), "Perfil guardado"))) throw {code:"handled"};
    } else {
      doc.photoData = PF.removed ? "" : (PF.blob ? await blobToDataURL(PF.blob) : (prev.photoData || ""));
      S.profiles[ME] = doc; store.set("profiles", S.profiles); toast("Perfil guardado");
    }
    S.profiles[ME] = {...prev, ...doc}; applyProfiles();
    closeSheet(); render();
  }catch(e){
    if (!e || e.code !== "handled") toast(e && e.code === "too_large" ? "La foto es muy pesada. Probá con otra." : e && e.code === "unsupported_type" ? "Ese formato de foto no se puede subir. Probá con otra." : "No se pudo guardar el perfil. Probá de nuevo.");
    if (PF){ PF.busy = false; btn.disabled = false; btn.textContent = "Guardar perfil"; }
  }
}
function memberSheet(id){
  const p = person(id);
  openSheet(p.name, `<div class="member-sheet">
      ${avatar(id, 148)}
      <span class="tag">${esc(p.nick)}</span>
      ${p.bio ? `<p class="bio">${esc(p.bio)}</p>` : `<p class="bio muted">${id === ME ? "Todavía no escribiste nada sobre vos." : "Todavía no escribió nada."}</p>`}
    </div>`, id === ME ? `<button class="btn btn-primary btn-block" data-act="profile">Editar mi perfil</button>` : "");
}

/* Estado de desbloqueo: bloqueado (con cuándo se abre) o abierto (con su acción) */
function lockState({open, title, when, action="", ilu:il=""}){
  return `<div class="lock ${open ? "is-open" : ""}">
    <span class="lock-ico">${icon(open ? "unlock" : "lock")}</span>
    <div class="grow" style="flex:1;min-width:0"><b>${esc(title)}</b><div class="small muted">${open ? "Ya está abierto" : "Se abre " + esc(when)}</div></div>
    ${open ? action : il}
  </div>`;
}

function pad(n){ return String(n).padStart(2,"0"); }
function countdownParts(target){
  let s = Math.max(0, Math.floor((target - Date.now())/1000));
  const d = Math.floor(s/86400); s -= d*86400;
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); s -= m*60;
  return [[pad(d),"días"],[pad(h),"horas"],[pad(m),"min"],[pad(s),"seg"]];
}
function tripParts(){

}

const RATES0 = {ARS:297, USD:5.4};   // AR$ por R$ (referencia del PDF) · R$ por US$ (referencia, editable)

];

S.payments = store.get("payments", []);
const r2 = v => Math.round(v*100)/100;
function money(v, c){
  const a = Math.abs(v), dec = Math.abs(a - Math.round(a)) > 0.004 ? 2 : 0;
  return CUR[c] + " " + a.toLocaleString("es-AR", {minimumFractionDigits:dec, maximumFractionDigits:dec});
}
function parseAmount(s){
  s = String(s || "").trim().replace(/\s|R\$|US\$|AR\$|\$/g, "");
  if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}
function balances(){
  const b = {}; Object.keys(CUR).forEach(c => { b[c] = {}; ALL.forEach(id => b[c][id] = 0); });
  S.expenses.forEach(e => { const sh = e.amount / e.split.length; b[e.cur][e.payer] += e.amount; e.split.forEach(id => b[e.cur][id] -= sh); });
  S.payments.forEach(p => { b[p.cur][p.from] += p.amount; b[p.cur][p.to] -= p.amount; });
  return b;
}
function transfers(){
  const b = balances(), out = [];
  for (const c in b){
    const cr = [], db = [];
    for (const id in b[c]){ const v = r2(b[c][id]); if (v > 0.009) cr.push({id, v}); else if (v < -0.009) db.push({id, v:-v}); }
    cr.sort((x,y) => y.v - x.v); db.sort((x,y) => y.v - x.v);
    let i = 0, j = 0;
    while (i < db.length && j < cr.length){
      const x = Math.min(db[i].v, cr[j].v);
      if (x > 0.009) out.push({from:db[i].id, to:cr[j].id, amount:r2(x), cur:c});
      db[i].v -= x; cr[j].v -= x;
      if (db[i].v < 0.01) i++;
      if (cr[j].v < 0.01) j++;
    }
  }
  return out;
}

    `<div class="foot-sum" id="f-sum" aria-live="polite"></div><button class="btn btn-primary btn-block" id="f-save" data-act="f-save">Guardar gasto</button>`);
  document.getElementById("sheet-foot").classList.add("stack");
  renderWho(); renderPreview();

    if (e.target.id === "f-amount") F.amount = e.target.value;
    if (e.target.id === "f-desc") F.desc = e.target.value;
    if (e.target.id === "f-payer") F.payer = e.target.value;
    renderPreview();
  };

function renderWho(){
  document.getElementById("f-who").innerHTML = PEOPLE.map(p => `<button type="button" class="who" data-act="f-who" data-id="${p.id}" aria-pressed="${F.split.has(p.id)}">${avatar(p.id, 30)}${esc(p.id === ME ? "Yo" : p.name)}</button>`).join("");
}
function formErrors(){
  const e = {}, a = parseAmount(F.amount);
  if (!(a > 0)) e.amount = "Escribí un monto mayor a 0.";
  if (!F.desc.trim()) e.desc = "Contá en una palabra qué fue.";
  if (!F.split.size) e.split = "Elegí al menos una persona.";
  return e;
}
function renderPreview(){
  const a = parseAmount(F.amount), n = F.split.size, err = formErrors();
  const box = document.getElementById("f-preview");
  let html = "";
  if (a > 0 && n){
    const share = a / n;
    const meIn = F.split.has(ME);
    let meLine;
    if (F.payer === ME) meLine = meIn ? `Te deben ${money(a - share, F.cur)} en total` : `Te deben ${money(a, F.cur)} en total`;
    else meLine = meIn ? `Le vas a deber ${money(share, F.cur)} a ${esc(person(F.payer).name)}` : `No ponés nada en este gasto`;
    html = `<div class="preview" aria-live="polite">
      <span class="eyebrow" style="color:var(--cobalt)">Vista previa del reparto</span>
      <div class="split-row"><span>${money(a,F.cur)} entre ${n}</span><b class="money">${money(share,F.cur)} cada una</b></div>
      <div class="me-line">${meLine}</div>
      <div class="avatar-stack" style="flex-wrap:wrap">${[...F.split].map(id => avatar(id, 28)).join("")}</div>
    </div>`;
  } else {
    html = `<div class="preview"><span class="eyebrow" style="color:var(--cobalt)">Vista previa del reparto</span><span class="small muted">Escribí el monto para ver cuánto pone cada una.</span></div>`;
  }
  if (F.tried && Object.keys(err).length) html = `<div class="error" role="alert">${Object.values(err).join(" ")}</div>` + html;
  box.innerHTML = html;
  const sum = document.getElementById("f-sum");
  if (sum) sum.innerHTML = a > 0 && n ? `<span>${money(a,F.cur)} ÷ ${n}</span><b class="money">${money(a/n,F.cur)} c/u</b>` : `<span class="muted">Escribí el monto para ver el reparto</span>`;
}
async function saveExpense(){
  F.tried = true;
  const err = formErrors();
  if (Object.keys(err).length){ renderPreview(); const first = err.amount ? "f-amount" : err.desc ? "f-desc" : null; if (first) document.getElementById(first).focus(); return; }
  const e = {id:Date.now(), day:NOW.day, desc:F.desc.trim(), amount:r2(parseAmount(F.amount)), cur:F.cur, payer:F.payer, split:[...F.split]};
  if (SH.on){
    const btn = document.getElementById("f-save"); btn.disabled = true;
    const ok = await write(db => db.collection("expenses").add({...e, by:ME, at:Date.now()}));
    btn.disabled = false; if (!ok) return;
  } else { S.expenses.push(e); store.set("expenses", S.expenses); }
  closeSheet(); document.activeElement && document.activeElement.blur();
  toast(`Gasto guardado: ${e.desc}, ${money(e.amount, e.cur)}`);
  if (S.view !== "gastos") go("gastos"); else render();
}

/* Conversor */
function toBRL(v,c){ return c === "BRL" ? v : c === "USD" ? v * S.rates.USD : v / S.rates.ARS; }
function fromBRL(v,c){ return c === "BRL" ? v : c === "USD" ? v / S.rates.USD : v * S.rates.ARS; }
let C = {amount:"100", from:"BRL", to:"ARS"};
function converterSheet(){
  openSheet("Conversor", `
    <div class="field"><label for="c-amount">Monto</label><input class="input input-money" id="c-amount" inputmode="decimal" value="${esc(C.amount)}"></div>
    <div class="row" style="align-items:flex-end">
      <div class="field grow"><span class="label">De</span><div class="seg" id="c-from">${Object.entries(CUR).map(([c,s]) => `<button type="button" data-act="c-from" data-cur="${c}" aria-pressed="${c === C.from}">${s}</button>`).join("")}</div></div>
      <button class="icon-btn" data-act="c-swap" aria-label="Invertir monedas">${icon("swap")}</button>
    </div>
    <div class="field"><span class="label">A</span><div class="seg" id="c-to">${Object.entries(CUR).map(([c,s]) => `<button type="button" data-act="c-to" data-cur="${c}" aria-pressed="${c === C.to}">${s}</button>`).join("")}</div></div>
    <div class="card"><span class="eyebrow">Son</span><div class="conv-result" id="c-result"></div></div>
    <div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="eyebrow">Cotización de referencia</span>
      <div class="field"><label for="c-ars">AR$ por cada R$ 1</label><input class="input" id="c-ars" inputmode="decimal" value="${String(S.rates.ARS).replace(".",",")}"></div>
      <div class="field"><label for="c-usd">R$ por cada US$ 1</label><input class="input" id="c-usd" inputmode="decimal" value="${String(S.rates.USD).replace(".",",")}"></div>
      <span class="hint">R$ 1 = AR$ 297 sale del itinerario. Cambialas cuando sepan la cotización del día.</span>
    </div>`);
  const sb = document.getElementById("sheet-body");
  const onInput = e => {
    if (e.target.id === "c-amount") C.amount = e.target.value;
    if (e.target.id === "c-ars"){ const v = parseAmount(e.target.value); if (v > 0){ S.rates.ARS = v; store.set("rates", S.rates); } }
    if (e.target.id === "c-usd"){ const v = parseAmount(e.target.value); if (v > 0){ S.rates.USD = v; store.set("rates", S.rates); } }
    renderConv();
  };
  sb.addEventListener("input", onInput);
  sheetCleanup = () => sb.removeEventListener("input", onInput);
  renderConv();
}
function renderConv(){
  const a = parseAmount(C.amount), el = document.getElementById("c-result"); if (!el) return;
  el.textContent = a >= 0 ? money(r2(fromBRL(toBRL(a, C.from), C.to)), C.to) : "—";
  document.querySelectorAll("#c-from button").forEach(b => b.setAttribute("aria-pressed", b.dataset.cur === C.from));
  document.querySelectorAll("#c-to button").forEach(b => b.setAttribute("aria-pressed", b.dataset.cur === C.to));
}

/* ================= Casa ================= */
/* Turnos: en la app compartida se arman sorteando desde MasterChef › Equipos (Martu no cocina ni lava).
   En modo de prueba se usan los turnos de ejemplo de TURNS. */
S.turns = store.get("turns", {});
function turn(d){
  const base = TURNS[d] || {cocinan:[], lavan:[], dinner:""}, o = S.turns[d] || {};
  const ok = a => Array.isArray(a) ? a.filter(id => person(id) && id !== "martu").slice(0, 4) : null;
  return {dinner: base.dinner, cocinan: ok(o.cocinan) || (SH.on || STANDALONE ? [] : base.cocinan), lavan: ok(o.lavan) || (SH.on || STANDALONE ? [] : base.lavan)};
}
function cookCounts(skipDay){
  const c = {}; ALL.forEach(id => c[id] = 0);
  DAYS.filter(d => d.n <= 6 && d.n !== skipDay).forEach(d => turn(d.n).cocinan.forEach(id => c[id]++));
  return c;
}

/* Votación de la cena: las opciones las arma el grupo (dinner/<día>); cada una vota una vez (votes/<día>-<persona>) */
const VOTE_CLOSES = "19:00";
const VOTE_DEMO = {options:[{id:"moqueca",name:"Moqueca de camarón"},{id:"pastas",name:"Pastas con pesto"},{id:"tacos",name:"Tacos de pescado"}], counts:{moqueca:4,pastas:3,tacos:2}};
S.dinner = store.get("dinner", {});
S.vote = store.get("vote2", {});
S.votes = []; S.mcr = []; S.draws = [];
function dinnerOptions(d){
  const x = S.dinner[d];
  if (x && Array.isArray(x.options)) return x.options.filter(o => o && typeof o.id === "string" && typeof o.name === "string").map(o => ({id:o.id, name:o.name.slice(0, 40)}));
  return SH.on || STANDALONE ? [] : (d === 5 ? VOTE_DEMO.options : []);
}
const voteOpen = () => !!turn(NOW.day).cocinan.length && NOW.min < toMinStr(VOTE_CLOSES);
function voteState(){
  const opts = dinnerOptions(NOW.day);
  if (!SH.on){ const mine = S.vote[NOW.day] || null; return {closes:VOTE_CLOSES, mine, options:opts.map(o => ({...o, votes:(NOW.day === 5 && !STANDALONE ? VOTE_DEMO.counts[o.id] || 0 : 0) + (mine === o.id ? 1 : 0)}))}; }
  const rows = S.votes.filter(v => v.day === NOW.day);
  return {closes:VOTE_CLOSES, mine:(rows.find(r => r.person === ME) || {}).option || null, options:opts.map(o => ({...o, votes:rows.filter(r => r.option === o.id).length}))};
}
async function saveDinnerOptions(options){
  if (SH.on) return write(db => db.doc("dinner/" + NOW.day).set({options, by:ME, at:Date.now()}));
  S.dinner[NOW.day] = {options}; store.set("dinner", S.dinner); return true;
}

S.super = store.get("super2", STANDALONE ? [] : [
  {t:"Hielo (3 bolsas)",d:false},{t:"Limones para caipirinha",d:false},{t:"Agua (6 bidones)",d:true},{t:"Protector solar 50",d:false},
  {t:"Pan y queso para el desayuno",d:true},{t:"Cerveza",d:true},{t:"Frutas",d:false},{t:"Brillos y cotillón",d:false}].map((x,i) => ({...x, _id:"s"+i, at:i})));

function voteSheet(){
  let pick = voteState().mine;
  const draw = () => {
    const V = voteState(), total = V.options.reduce((s,o) => s + o.votes, 0) || 1, t = turn(NOW.day);
    document.getElementById("sheet-body").innerHTML = `<p class="small muted" style="margin:0">${t.cocinan.length ? `Cocinan ${names(t.cocinan)}. ` : ""}La votación cierra a las ${V.closes}. Cualquiera puede sumar o sacar opciones.</p>
      ${V.options.map(o => `<div class="opt-row"><button class="opt" role="radio" aria-checked="${pick === o.id}" data-act="vote-pick" data-id="${esc(o.id)}"><span class="radio"></span><span style="flex:1;min-width:0"><b>${esc(o.name)}</b>${V.mine ? `<div class="bar" style="margin-top:8px"><i style="width:${Math.round(o.votes/total*100)}%"></i></div>` : ""}</span>${V.mine ? `<span class="small num">${o.votes}</span>` : ""}</button><button class="icon-btn opt-del" data-act="vote-del" data-id="${esc(o.id)}" aria-label="Sacar ${esc(o.name)}">${icon("x")}</button></div>`).join("") || `<div class="empty" style="padding:12px">${ilu("rama","width:56px")}<span class="small muted">Sin opciones todavía.</span></div>`}
      <form class="row" id="vote-add" style="align-items:stretch"><label for="vote-new" style="position:absolute;left:-9999px">Nueva opción</label><input class="input" id="vote-new" placeholder="Sumar una opción: ej. sushi" maxlength="40" autocomplete="off" style="flex:1;min-width:0"><button class="btn btn-secondary" type="submit">Sumar</button></form>`;
    document.getElementById("vote-add").addEventListener("submit", async e => {
      e.preventDefault(); const inp = document.getElementById("vote-new"), v = inp.value.trim(); if (!v) return;
      const opts = dinnerOptions(NOW.day);
      if (opts.some(o => o.name.toLowerCase() === v.toLowerCase())){ inp.value = ""; return; }
      if (opts.length >= 8){ toast("Hasta 8 opciones por votación."); return; }
      if (await saveDinnerOptions([...opts, {id:"o" + Date.now().toString(36), name:v}])){ inp.value = ""; draw(); render(); }
    });
    const btn = document.getElementById("vote-go");
    btn.disabled = !pick || pick === V.mine || !V.options.some(o => o.id === pick);
    btn.textContent = V.mine ? "Cambiar mi voto" : "Votar";
  };
  openSheet("La cena de hoy", "", `<button class="btn btn-primary btn-block" id="vote-go" data-act="vote-go">Votar</button>`);
  ACTIONS["vote-pick"] = el => { pick = el.dataset.id; draw(); };
  ACTIONS["vote-del"] = async el => {
    const opts = dinnerOptions(NOW.day).filter(o => o.id !== el.dataset.id);
    if (await saveDinnerOptions(opts)){ if (pick === el.dataset.id) pick = null; draw(); render(); }
  };
  ACTIONS["vote-go"] = async () => {
    if (!pick) return;
    if (SH.on){
      if (!(await write(db => db.doc(`votes/${NOW.day}-${ME}`).set({day:NOW.day, person:ME, option:pick, at:Date.now()}), "Voto guardado"))) return;
    } else { S.vote[NOW.day] = pick; store.set("vote2", S.vote); toast("Voto guardado"); }
    draw(); render();
  };
  sheetRefresh = () => { if (!document.activeElement || document.activeElement.id !== "vote-new") draw(); };
  draw();
}

/* ================= MasterChef Búzios =================
   Equipos sorteados (turns/<día>), votos por categoría (mc/<día>-<persona>: {scores}), foto y nombre del plato (mcdish/<día>). */
const MC_CATS = [["presentacion","Presentación"],["sabor","Sabor"],["creatividad","Creatividad"],["equipo","Trabajo en equipo"]];
S.mcTab = "ranking"; S.mcDay = null; S.mcDraft = null;
S.dish = store.get("dish", {});
S.mcLocal = store.get("mc2", STANDALONE ? {} : {
  2:[{person:"feda",scores:{presentacion:4,sabor:5,creatividad:4,equipo:5}},{person:"maru",scores:{presentacion:5,sabor:4,creatividad:3,equipo:4}},{person:"jose",scores:{presentacion:4,sabor:4,creatividad:4,equipo:5}}],
  3:[{person:"cande",scores:{presentacion:3,sabor:5,creatividad:4,equipo:4}},{person:"lulu",scores:{presentacion:4,sabor:4,creatividad:5,equipo:3}}]
});
const mcRows = d => SH.on ? S.mcr.filter(r => r.day === d && r.scores && typeof r.scores === "object" && person(r.person)) : (S.mcLocal[d] || []);
function mcStats(d){
  const rows = mcRows(d), cats = {};
  MC_CATS.forEach(([k]) => { const v = rows.map(r => Number(r.scores[k])).filter(x => x >= 1 && x <= 5); cats[k] = v.length ? v.reduce((a,b) => a+b, 0) / v.length : 0; });
  const vals = MC_CATS.map(([k]) => cats[k]).filter(Boolean);
  return {n:rows.length, cats, total: vals.length ? vals.reduce((a,b) => a+b, 0) / vals.length : 0, mine:(rows.find(r => r.person === ME) || {}).scores || null};
}

/* Foto y nombre del plato */
async function resizeJpeg(file, max = 1000){
  let src = null;
  try{ src = await createImageBitmap(file); }catch(e){}
  if (!src) src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  const k = Math.min(1, max / Math.max(src.width, src.height)), c = document.createElement("canvas");
  c.width = Math.round(src.width * k); c.height = Math.round(src.height * k);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", .85));
}

/* Sorteo de turnos con el bolillero: entra primero quien menos veces cocinó (o lavó) */
function teamDraw(d, role){
  const size = role === "cocinan" ? 3 : 2;
  const count = {}; ALL.forEach(id => count[id] = 0);
  DAYS.filter(x => x.n <= 6 && x.n !== d).forEach(x => turn(x.n)[role].forEach(id => count[id]++));
  const other = role === "cocinan" ? turn(d).lavan : turn(d).cocinan;
  const cands = ALL.filter(id => id !== "martu" && !other.includes(id));
  const levels = [...new Set(cands.map(id => count[id]))].sort((a,b) => a-b);
  let pool = [];
  for (const lv of levels){ pool = pool.concat(cands.filter(id => count[id] === lv)); if (pool.length >= size) break; }
  bolilleroSheet({team:{day:d, role, size, pool}});
}
async function saveTeam(){
  const T = BOL && BOL.team; if (!T) return;
  const picked = BOL.drawn.slice(0, T.size), cur = turn(T.day);
  const doc = {cocinan: cur.cocinan.filter(id => !picked.includes(id)), lavan: cur.lavan.filter(id => !picked.includes(id))};
  doc[T.role] = picked;
  const nm = picked.map(id => person(id).name), label = `${T.role === "cocinan" ? "Cocinan" : "Lavan"} el ${DAYS[T.day-1].short.toLowerCase()}: ${nm.length > 1 ? nm.slice(0,-1).join(", ") + " y " + nm[nm.length-1] : nm[0]}`;
  if (SH.on){ if (!(await write(db => db.doc("turns/" + T.day).set({...doc, by:ME, at:Date.now()})))) return; }
  else { S.turns[T.day] = doc; store.set("turns", S.turns); }
  closeSheet(); toast(label);
  S.mcTab = "equipos"; if (S.view === "masterchef") render(); else go("masterchef");
}

/* Fecha y hora de Brasil para lo que se guarda con «at» */
function fmtAt(at){
  const d = new Date(at - 3*3600e3), day = Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - TRIP_DAY0)/864e5) + 1;
  const dd = DAYS[day-1] ? DAYS[day-1].short : pad(d.getUTCDate()) + "/" + pad(d.getUTCMonth()+1);
  return dd + " · " + pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes());
}

/* ================= Bolillero (tipo bingo) =================
   Bolas numeradas con nuestros nombres, o con opciones que se escriben ahí.
   En modo compartido, cada sorteo se guarda en «draws» y lo ven todas. */
let BOL = null;
const rnd = n => { try{ const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }catch(e){ return Math.floor(Math.random()*n); } };
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const BALL_COLS = ["#F3D55B","#BFDDF0","#F7E7A6","#E4F0F8","#F6C9A8","#E9C6D9"];
function bolilleroSheet(arg){
  const team = arg && arg.team || null;
  BOL = {mode:"names", team, pool:new Set(team ? team.pool : ALL), opts:[], noRepeat:true, drawn:[], spinning:false, winner:null, raf:0, balls:[]};
  openSheet(team ? `Sorteo · ${team.role === "cocinan" ? "cocina" : "lavado"} del ${DAYS[team.day-1].short.toLowerCase()}` : "Bolillero", `
    ${team ? `<p class="small muted" style="margin:0">Salen ${team.size} bolas. Adentro están las que menos veces ${team.role === "cocinan" ? "cocinaron" : "lavaron"}; podés sumar o sacar nombres abajo.</p>` : ""}
    <div class="seg" role="group" aria-label="Qué hay en las bolas" ${team ? "hidden" : ""}><button type="button" data-act="b-mode" data-mode="names" aria-pressed="true">Nuestros nombres</button><button type="button" data-act="b-mode" data-mode="options" aria-pressed="false">Opciones</button></div>
    <div class="field" ${team ? "hidden" : ""}><label for="b-q">¿Qué sorteamos?</label><input class="input" id="b-q" placeholder="Ej.: ¿Quién elige la música?" maxlength="60" autocomplete="off" value="${team ? `¿Quién ${team.role === "cocinan" ? "cocina" : "lava"} el ${DAYS[team.day-1].short.toLowerCase()}?` : ""}"></div>
    <div class="drum-wrap"><canvas id="b-canvas" aria-hidden="true"></canvas><div class="drum-result" id="b-result" role="status" aria-live="polite" hidden></div></div>
    <div id="b-out"></div>
    <div id="b-pool"></div>
    <button class="check" role="checkbox" aria-checked="true" data-act="b-norep" id="b-norep"><span class="box">${icon("check")}</span><span>Sin repetir: la bola que sale queda afuera</span></button>
    <div id="b-history"></div>`,
    `<button class="btn btn-primary btn-block" id="b-go" data-act="b-spin">Girar el bolillero</button>`);
  bolBuild(); bolUI();
  const loop = () => { bolStep(); BOL.raf = requestAnimationFrame(loop); };
  BOL.raf = requestAnimationFrame(loop);
  sheetRefresh = () => { if (BOL) bolHistory(); };
  sheetCleanup = () => { cancelAnimationFrame(BOL.raf); BOL = null; };
}
/* Cada bola: {key, label, num}; key = id de persona u «o:<texto>» */
function bolAll(){
  return BOL.mode === "names"
    ? PEOPLE.filter(p => BOL.pool.has(p.id)).map(p => ({key:p.id, label:p.name, num:ALL.indexOf(p.id) + 1}))
    : BOL.opts.map((t,i) => ({key:"o:" + t, label:t, num:i + 1}));
}
const bolInside = () => bolAll().filter(b => !(BOL.noRepeat && BOL.drawn.includes(b.key)));
function bolBuild(){
  const cv = document.getElementById("b-canvas"), W = cv.clientWidth || 300, R = W/2 - 12;
  const items = bolInside(), r = Math.max(18, Math.min(28, R / Math.sqrt(items.length + 2) * 0.62));
  BOL.balls = items.map((it,i) => {
    const a = Math.PI * (0.15 + 0.7 * Math.random()), d = (R - r) * (0.35 + 0.6 * Math.random());
    const p = person(it.key);
    return {...it, r, x:W/2 + Math.cos(a) * d * (i % 2 ? 1 : -1), y:W/2 + Math.sin(a) * d, vx:0, vy:0, col: p && p.look ? p.look.bg : BALL_COLS[(it.num-1) % BALL_COLS.length]};
  });
  BOL.winner = null;
}
function bolUI(){
  document.querySelectorAll('[data-act="b-mode"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === BOL.mode));
  document.getElementById("b-q").placeholder = BOL.mode === "names" ? "Ej.: ¿Quién elige la música?" : "Ej.: ¿Dónde cenamos?";
  const pool = document.getElementById("b-pool");
  if (BOL.mode === "names"){
    pool.innerHTML = `<div class="field"><div class="row" style="justify-content:space-between"><span class="label">Bolas adentro</span>
      <span class="row" style="gap:4px"><button type="button" class="btn btn-ghost btn-sm" data-act="b-all">Todas</button><button type="button" class="btn btn-ghost btn-sm" data-act="b-nobride">Sin la novia</button></span></div>
      <div class="who-grid">${PEOPLE.filter(p => !(BOL.team && p.bride)).map(p => `<button type="button" class="who" data-act="b-who" data-id="${p.id}" aria-pressed="${BOL.pool.has(p.id)}" ${BOL.noRepeat && BOL.drawn.includes(p.id) ? 'style="opacity:.45"' : ""}>${avatar(p.id, 28)}${esc(p.name)}</button>`).join("")}</div></div>`;
  } else {
    pool.innerHTML = `<div class="field"><label for="b-opt">Opciones en las bolas</label>
      <form class="row" id="b-opt-form" style="align-items:stretch"><input class="input" id="b-opt" placeholder="Ej.: Pizza" maxlength="24" autocomplete="off" style="flex:1;min-width:0"><button class="btn btn-secondary" type="submit">Sumar</button></form>
      <div class="who-grid">${BOL.opts.map((t,i) => `<button type="button" class="who" data-act="b-opt-del" data-i="${i}" aria-label="Sacar ${esc(t)}" ${BOL.noRepeat && BOL.drawn.includes("o:" + t) ? 'style="opacity:.45"' : ""}><span class="ball-mini" style="background:${BALL_COLS[i % BALL_COLS.length]}">${i+1}</span>${esc(t)} ${icon("x")}</button>`).join("") || `<span class="hint">Sumá al menos dos opciones.</span>`}</div></div>`;
    document.getElementById("b-opt-form").addEventListener("submit", e => {
      e.preventDefault(); const inp = document.getElementById("b-opt"), v = inp.value.trim();
      if (!v || BOL.opts.includes(v)) { inp.value = ""; return; }
      BOL.opts.push(v); inp.value = ""; bolBuild(); bolUI(); document.getElementById("b-opt").focus();
    });
  }
  document.getElementById("b-norep").setAttribute("aria-checked", BOL.noRepeat);
  document.querySelector("#b-norep .box").innerHTML = BOL.noRepeat ? icon("check") : "";
  const out = BOL.drawn.map(k => bolAll().find(b => b.key === k) || {key:k, label:k.replace(/^o:/,""), num:"·"});
  document.getElementById("b-out").innerHTML = out.length ? `<div class="bingo-row"><span class="eyebrow">Salieron</span><div class="bingo-balls">${out.map((b,i) => `<span class="bball" style="background:${(person(b.key) && person(b.key).look ? person(b.key).look.bg : BALL_COLS[(Number(b.num)-1 || 0) % BALL_COLS.length])}"><b>${b.num}</b>${esc(b.label)}</span>`).join("")}</div><button class="btn btn-ghost btn-sm" data-act="b-reset">Volver a meterlas</button></div>` : "";
  bolHistory();
  const go = document.getElementById("b-go"), n = bolInside().length;
  if (BOL.team && BOL.drawn.length >= BOL.team.size && !BOL.spinning){
    go.dataset.act = "b-team-save"; go.disabled = false;
    go.textContent = `Guardar: ${BOL.drawn.slice(0, BOL.team.size).map(id => person(id).name).join(", ")}`;
    return;
  }
  go.dataset.act = "b-spin";
  go.disabled = BOL.spinning || n === 0 || (BOL.mode === "options" && bolAll().length < 2);
  go.textContent = BOL.spinning ? "Girando…" : n === 0 && bolAll().length ? "No quedan bolas" : BOL.team ? `Sacar la bola ${BOL.drawn.length + 1} de ${BOL.team.size}` : BOL.drawn.length ? "Sacar otra" : "Girar el bolillero";
}
function bolHistory(){
  const el = document.getElementById("b-history"); if (!el) return;
  const rows = SH.on ? S.draws.slice(0, 6) : [];
  el.innerHTML = rows.length ? `<div class="card" style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Últimos sorteos del grupo</span>${rows.map(r => `<div class="row small"><span class="grow">${r.q ? esc(r.q) + " → " : ""}<b>${esc(person(r.winner) ? person(r.winner).name : String(r.winner).replace(/^o:/,""))}</b></span><span class="muted">${esc(fmtAt(r.at))}</span></div>`).join("")}</div>` : "";
}
function bolStep(){
  const cv = document.getElementById("b-canvas"); if (!cv || !BOL) return;
  const W = cv.clientWidth, dpr = window.devicePixelRatio || 1;
  if (!W) return;
  if (cv.width !== Math.round(W*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(W*dpr); }
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0);
  const cx = W/2, cy = W/2, R = W/2 - 12, B = BOL.balls, spin = BOL.spinning;
  for (const b of B){
    if (b === BOL.winner){ b.x += (cx - b.x) * .12; b.y += (cy - b.y) * .12; b.r += (R*.42 - b.r) * .12; continue; }
    b.vy += .32;
    if (spin){ const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx,dy) || 1; b.vx += (-dy/d) * 1.1 + (Math.random()-.5) * 1.6; b.vy += (dx/d) * 1.1 + (Math.random()-.5) * 1.6; }
    b.vx *= .985; b.vy *= .985; b.x += b.vx; b.y += b.vy;
    const dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx,dy), lim = R - b.r - 3;
    if (d > lim){ const nx = dx/d, ny = dy/d; b.x = cx + nx*lim; b.y = cy + ny*lim; const vn = b.vx*nx + b.vy*ny; if (vn > 0){ b.vx -= 1.6*vn*nx; b.vy -= 1.6*vn*ny; } }
  }
  for (let i = 0; i < B.length; i++) for (let j = i+1; j < B.length; j++){
    const a = B[i], b = B[j]; if (a === BOL.winner || b === BOL.winner) continue;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx,dy) || .01, min = a.r + b.r;
    if (d < min){ const nx = dx/d, ny = dy/d, o = (min - d)/2; a.x -= nx*o; a.y -= ny*o; b.x += nx*o; b.y += ny*o;
      const rv = (b.vx - a.vx)*nx + (b.vy - a.vy)*ny; if (rv < 0){ const k = -.9*rv; a.vx -= k*nx; a.vy -= k*ny; b.vx += k*nx; b.vy += k*ny; } }
  }
  ctx.clearRect(0,0,W,W);
  ctx.fillStyle = "#E4F0F8"; ctx.strokeStyle = "#2D48A6"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.lineWidth = 2; ctx.setLineDash([3,9]); ctx.beginPath(); ctx.arc(cx,cy,R-10,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(spin ? (performance.now()/180) : 0);
  ctx.lineWidth = 3; for (let k = 0; k < 4; k++){ ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-14); ctx.stroke(); }
  ctx.restore();
  if (!B.length){
    ctx.fillStyle = "#5A6487"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.font = "600 14px Figtree, system-ui, sans-serif";
    ctx.fillText(BOL.mode === "options" ? "Sumá opciones abajo" : "No quedan bolas", cx, cy);
  }
  const order = BOL.winner ? [...B.filter(b => b !== BOL.winner), BOL.winner] : B;
  for (const b of order){
    const win = b === BOL.winner;
    ctx.globalAlpha = BOL.winner && !win ? .35 : 1;
    ctx.fillStyle = win ? "#F3D55B" : b.col; ctx.strokeStyle = "#2D48A6"; ctx.lineWidth = win ? 4 : 2;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#FFFDF7"; ctx.beginPath(); ctx.ellipse(b.x - b.r*.42, b.y - b.r*.45, b.r*.2, b.r*.12, -.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#1B2550"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `500 ${Math.max(9, Math.round(b.r * .5))}px "Bodoni Moda", Georgia, serif`;
    ctx.fillText(String(b.num), b.x, b.y - b.r * .32);
    const label = b.label.length > 9 && !win ? b.label.slice(0, 8) + "…" : b.label;
    ctx.font = `700 ${Math.max(8, Math.round(b.r * (win ? .3 : .38)))}px Figtree, system-ui, sans-serif`;
    ctx.fillText(label, b.x, b.y + b.r * .22);
    ctx.globalAlpha = 1;
  }
}
function bolSpin(){
  if (!BOL || BOL.spinning) return;
  document.getElementById("b-result").hidden = true;
  if (BOL.winner) bolBuild();
  if (!BOL.balls.length) return;
  BOL.spinning = true; bolUI();
  setTimeout(() => {
    if (!BOL) return;
    BOL.spinning = false;
    const w = BOL.balls[rnd(BOL.balls.length)]; BOL.winner = w;
    BOL.drawn.push(w.key);
    const q = document.getElementById("b-q").value.trim();
    if (SH.on) write(db => db.collection("draws").add({q, winner:w.key, by:ME, at:Date.now()}));
    setTimeout(() => {
      if (!BOL) return;
      const res = document.getElementById("b-result"), p = person(w.key);
      res.innerHTML = `${p ? avatar(w.key, 64) : `<span class="ball-big">${w.num}</span>`}<b>${esc(w.label)}</b>${q ? `<span class="small">${esc(q)}</span>` : `<span class="small">Bola número ${w.num}</span>`}`;
      res.hidden = false; bolUI();
    }, reduceMotion() ? 0 : 650);
  }, reduceMotion() ? 0 : 2300);
}

  "to-cover": () => go("portada")
};

/* ================= Datos compartidos =================
   Con la base de la página (db) todas ven lo mismo en vivo. Sin ella (archivo local o sin sesión),
   la app muestra datos de ejemplo que quedan solo en este teléfono. */
const SH = {on:false, db:null, assets:null, dl:null, uid:null, owner:false, runtime:!!(window.claude && window.claude.use), loading:false, stale:false, err:""};
let sheetRefresh = null, refreshPending = false;
function refresh(){
  const a = document.activeElement;
  if (a && a.closest && a.closest("#main") && a.matches("input,textarea")){ refreshPending = true; }
  else if (S.view !== "portada") render();
  if (sheetRefresh) sheetRefresh();
}
document.addEventListener("focusout", () => setTimeout(() => {
  if (refreshPending && !(document.activeElement && document.activeElement.matches && document.activeElement.matches("input,textarea"))){ refreshPending = false; refresh(); }
}, 120));
async function write(fn, okMsg){
  try{ await fn(SH.db); if (okMsg) toast(okMsg); return true; }
  catch(e){
    if (e && e.code === "unavailable"){ try{ await new Promise(r => setTimeout(r, 600 + Math.random()*600)); await fn(SH.db); if (okMsg) toast(okMsg); return true; }catch(e2){ e = e2; } }
    toast(e && e.code === "quota_exceeded" ? "La base de la app está llena: hay que borrar cosas viejas." : e && e.code === "invalid_argument" ? "No tenés permiso para guardar. Pedile a Feda que te invite como editora." : "No se pudo guardar. Revisá la conexión y probá de nuevo.");
    return false;
  }
}
async function connectShared(){
  if (!SH.runtime) return;
  const use = n => window.claude.use(n).catch(() => null);
  const [db, user, assets, dl] = await Promise.all([use("db"), use("user"), use("assets"), use("downloads")]);
  SH.dl = dl;
  if (user){ SH.owner = await user.isOwner(); SH.uid = await user.id(); }
  if (!SH.owner && !LIVE && S.open){ S.open = false; }       // la vista previa es solo para quien organiza
  if (!db){ route(); return; }
  SH.on = true; SH.db = db; SH.assets = assets; SH.loading = true;
  S.profiles = {}; applyProfiles(); S.turns = {}; S.dinner = {}; S.dish = {};
  S.expenses = []; S.payments = []; S.super = []; S.wall = []; S.media = []; S.votes = []; S.mcr = []; S.draws = [];
  const timer = setTimeout(() => { if (SH.loading){ SH.stale = true; refresh(); } }, 10000);
  const sub = (name, apply) => db.collection(name).onSnapshot(snap => {
      apply(snap.docs.map(d => ({...d.data(), _id:d.id})));
      if (!snap.metadata.fromCache){ SH.loading = false; SH.stale = false; clearTimeout(timer); }
      refresh();
    }, e => { SH.loading = false; clearTimeout(timer); if (e.code !== "revoked") SH.err = "No se pudieron cargar los datos compartidos. Cerrá y volvé a abrir la app."; refresh(); });
  const byAt = (a,b) => (a.at || 0) - (b.at || 0);
  sub("expenses", rows => S.expenses = rows.filter(r => person(r.payer) && Array.isArray(r.split) && r.split.length && CUR[r.cur]).sort(byAt));
  sub("payments", rows => S.payments = rows.filter(r => person(r.from) && person(r.to) && CUR[r.cur]));
  sub("super", rows => S.super = rows.sort((a,b) => byAt(b,a)));
  sub("wall", rows => S.wall = rows.sort((a,b) => byAt(b,a)));
  sub("media", rows => S.media = rows.filter(r => r.asset && DAYS[r.day-1]).sort(byAt).map(r => ({...r, id:r._id, src:"/_blob/" + encodeURIComponent(r.asset), sample:false, dur:"", nominated:Object.values(r.noms || {}).some(Boolean)})));
  sub("profiles", rows => { S.profiles = Object.fromEntries(rows.filter(r => person(r._id)).map(r => [r._id, r])); applyProfiles(); });
  sub("votes", rows => S.votes = rows);
  sub("turns", rows => { S.turns = Object.fromEntries(rows.filter(r => DAYS[Number(r._id)-1]).map(r => [Number(r._id), r])); });
  sub("dinner", rows => { S.dinner = Object.fromEntries(rows.filter(r => DAYS[Number(r._id)-1]).map(r => [Number(r._id), r])); });
  sub("mcdish", rows => { S.dish = Object.fromEntries(rows.filter(r => DAYS[Number(r._id)-1]).map(r => [Number(r._id), r])); });
  sub("mc", rows => S.mcr = rows);
  sub("draws", rows => S.draws = rows.sort((a,b) => byAt(b,a)));
  if (!ME && SH.uid){
    try{ const p = await db.doc("data/users/" + SH.uid + "/profile").get(); const id = p.exists && p.data().person; if (person(id)){ ME = id; store.set("me", ME); } }catch(e){}
  }
  route();
}
function banner(){
  if (SH.err) return `<div class="banner warn" role="alert">${esc(SH.err)}</div>`;
  if (SH.on && SH.stale) return `<div class="banner warn" role="status">Los datos del grupo todavía no cargan. Lo que ves puede no estar al día.</div>`;
  if (!SH.on) return STANDALONE ? `<div class="banner" role="note">En esta copia, lo que cargues queda solo en este teléfono. Para compartir con el grupo, usá el link de claude.ai.</div>` : `<div class="banner" role="note">Modo de prueba: los datos de ejemplo y lo que cargues quedan solo en este teléfono.</div>`;
  return "";
}


/* ================= Navegación ================= */
const TABS = [["hoy","Hoy","sun"],["galeria","Galería","image"],["gastos","Gastos","wallet"],["casa","Casa","home"],["mas","Más","more"]];
const SUB = {integrantes:"mas",juegos:"mas",premios:"mas",muro:"mas",semana:"casa",super:"casa",masterchef:"casa"};
function screenFor(v){
  const fn = window["screen_" + v] || (v === "hoy" ? screenHoy : null);
  return fn ? fn() : `<div class="card">Pantalla en construcción</div>`;
}
function render(){
  const v = S.view;
  const cover = document.getElementById("cover"), main = document.getElementById("main"), bar = document.getElementById("tabbar");
  if (v === "portada"){
    renderCover(); cover.hidden = false; main.innerHTML = ""; bar.hidden = true; return;
  }
  cover.hidden = true; bar.hidden = false;
  main.innerHTML = `<div class="screen" id="screen-${ME ? v : "quien"}">${banner()}${ME ? screenFor(v) : screenWho()}</div>`;
  const tab = SUB[v] || v;
  bar.innerHTML = TABS.map(([id,label,ic]) => `<a href="#${id}" ${tab === id ? 'aria-current="page"' : ""}>${icon(ic)}<span>${label}</span></a>`).join("");
  if (ME && window["after_" + v]) window["after_" + v]();
}
function route(){
  if (!document.getElementById("sheet").hidden) closeSheet();
  const vw = document.getElementById("viewer");
  if (!vw.hidden){ vw.hidden = true; vw.innerHTML = ""; viewerId = null; document.body.style.overflow = ""; }
  const h = location.hash.slice(1);
  const valid = h && (h === "portada" || TABS.some(t => t[0] === h) || SUB[h]);
  S.view = !S.open ? "portada" : (valid ? h : "portada");
  if (!S.open && h && h !== "portada") history.replaceState(null, "", "#portada");
  render();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
function go(v){ if (location.hash.slice(1) === v) route(); else location.hash = v; }

/* ================= Panel inferior ================= */
let sheetCleanup = null;
function openSheet(title, body, foot=""){
  const sh = document.getElementById("sheet"), sc = document.getElementById("scrim");
  document.getElementById("sheet-title").textContent = title;
  document.getElementById("sheet-body").innerHTML = body;
  const f = document.getElementById("sheet-foot"); f.innerHTML = foot; f.hidden = !foot;
  sh.hidden = false; sc.hidden = false;
  requestAnimationFrame(() => { sh.classList.add("show"); sc.classList.add("show"); });
  document.body.style.overflow = "hidden";
}
function closeSheet(){
  const sh = document.getElementById("sheet"), sc = document.getElementById("scrim");
  sh.classList.remove("show"); sc.classList.remove("show");
  document.body.style.overflow = "";
  if (sheetCleanup){ sheetCleanup(); sheetCleanup = null; }
  setTimeout(() => { if (!sh.classList.contains("show")){ sh.hidden = true; sc.hidden = true; document.getElementById("sheet-foot").classList.remove("stack"); } }, 260);
}
document.getElementById("scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

/* Teclado: el panel se apoya sobre el teclado y la barra inferior se esconde al escribir */
function syncViewport(){
  const vv = window.visualViewport; if (!vv) return;
  const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  document.documentElement.style.setProperty("--kb", kb + "px");
  document.documentElement.style.setProperty("--vvh", vv.height + "px");
  document.body.classList.toggle("kb-open", kb > 80);
}
if (window.visualViewport){ visualViewport.addEventListener("resize", syncViewport); visualViewport.addEventListener("scroll", syncViewport); }
syncViewport();
document.addEventListener("focusin", e => {
  if (e.target.matches("input:not([type=checkbox]):not([type=file]),textarea,select")){
    document.body.classList.add("typing");
    setTimeout(() => e.target.scrollIntoView({block:"center", behavior:"smooth"}), 300);
  }
});
document.addEventListener("focusout", () => setTimeout(() => {
  if (!document.activeElement || !document.activeElement.matches("input,textarea,select")) document.body.classList.remove("typing");
}, 50));

/* ================= Aviso ================= */
let toastT;
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2400);
}

/* ================= Acciones ================= */
const ACTIONS = {
  "close-sheet": closeSheet,
  "itinerary": itinerarySheet,
  "toggle-open": () => { S.open = !S.open; store.set("open", S.open); renderCover(); toast(S.open ? "Modo viaje: la app está abierta" : "Volvimos a la cuenta regresiva"); },
  ...MORE_ACTIONS
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && ACTIONS[el.dataset.act]){ if (!el.hasAttribute("download")) e.preventDefault(); ACTIONS[el.dataset.act](el, e); }
  const tl = e.target.closest("a[data-tab]");
  if (tl) S.mcTab = tl.dataset.tab;
  const dl = e.target.closest("a[data-day]");
  if (dl) S.galDay = Number(dl.dataset.day);
});

route();
connectShared();
</script>
